services:
  # База данных PostgreSQL 15.8 для кредитного конвейера
  postgres:
    image: postgres:15.8-alpine
    container_name: alfa_credit_postgres
    environment:
      POSTGRES_USER: alfa_user
      POSTGRES_PASSWORD: alfa_password
      POSTGRES_DB: alfa_credit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alfa_user -d alfa_credit_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Бэкенд сервис на Go (запуск вместе с БД: docker compose up -d, либо локально только БД: docker compose up -d postgres)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: alfa_credit_backend
    environment:
      PORT: 8080
      APP_ENV: production
      DB_DSN: postgres://alfa_user:alfa_password@postgres:5432/alfa_credit_db?sslmode=disable
      JWT_SECRET: hackathon-alfa-super-secret-key-2026
      JWT_EXPIRATION_HOURS: 24
      CASES_FILE_PATH: /app/scoring/testdata/cases.json
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Фронтенд сервис (SPA React на Nginx с проксированием /api/ на backend)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alfa_credit_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
